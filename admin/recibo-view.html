<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo de Aluguel — PS Corretor</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  body { background: var(--color-surface-alt); padding: var(--space-6) var(--space-4); }
  .recibo-toolbar { max-width: 720px; margin: 0 auto var(--space-4); display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
  .recibo-sheet {
    max-width: 720px; margin: 0 auto; background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    padding: var(--space-8); color: #101828;
  }
  .recibo-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); border-bottom: 2px solid var(--color-navy-900); padding-bottom: var(--space-5); }
  .recibo-head img { height: 52px; }
  .recibo-head h1 { font-size: var(--fs-lg); font-weight: var(--fw-extrabold); color: var(--color-navy-900); }
  .recibo-head .eyebrow { font-size: 11px; font-weight: var(--fw-bold); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-gold-600); margin-bottom: 2px; }
  .recibo-head .num { text-align: right; font-size: var(--fs-sm); color: var(--color-text-tertiary); }
  .recibo-valor { text-align: center; margin: var(--space-6) 0; }
  .recibo-valor .label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-tertiary); }
  .recibo-valor .valor { font-size: var(--fs-3xl); font-weight: var(--fw-extrabold); color: var(--color-navy-900); margin-top: 4px; }
  .recibo-texto { font-size: var(--fs-base); line-height: var(--lh-relaxed); color: var(--color-text-primary); margin: var(--space-6) 0; text-align: justify; }
  .recibo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin: var(--space-6) 0; font-size: var(--fs-sm); }
  .recibo-grid div span { display: block; font-size: var(--fs-xs); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .recibo-obs { font-size: var(--fs-sm); color: var(--color-text-secondary); border-top: 1px dashed var(--color-border-strong); padding-top: var(--space-4); margin-top: var(--space-4); }

  /* ---- Bloco de pagamento via Pix ---- */
  .recibo-pix {
    display: grid; grid-template-columns: 1fr auto; gap: var(--space-6); align-items: center;
    margin: var(--space-6) 0; padding: var(--space-5); border-radius: var(--radius-lg);
    background: linear-gradient(155deg, #0E2748 0%, #071426 100%); color: #fff;
  }
  .recibo-pix__title { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-gold-400); }
  .recibo-pix__title svg { width: 18px; height: 18px; }
  .recibo-pix__bank { font-size: var(--fs-xs); color: rgba(255,255,255,0.6); margin-top: 2px; }
  .recibo-pix__keys { margin-top: var(--space-4); display: flex; flex-direction: column; gap: 10px; }
  .recibo-pix__key { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius-md); padding: 9px 12px; }
  .recibo-pix__key div { min-width: 0; }
  .recibo-pix__key span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); }
  .recibo-pix__key strong { display: block; font-size: var(--fs-sm); font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recibo-pix__key button {
    flex-shrink: 0; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff;
    font-size: 11px; font-weight: var(--fw-semibold); padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer;
    transition: background 0.15s;
  }
  .recibo-pix__key button:hover { background: rgba(255,255,255,0.18); }
  .recibo-pix__key button.is-copied { background: var(--color-gold-500); border-color: var(--color-gold-500); }
  .recibo-pix__qr { text-align: center; }
  .recibo-pix__qr img { width: 152px; height: 152px; border-radius: 10px; background: #fff; padding: 8px; display: block; }
  .recibo-pix__qr p { margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.55); max-width: 152px; }
  .recibo-pix__copiaecola { margin-top: var(--space-4); }
  .recibo-pix__copiaecola button {
    width: 100%; border: 1px dashed rgba(255,255,255,0.3); background: transparent; color: rgba(255,255,255,0.85);
    font-size: 11px; font-weight: var(--fw-semibold); padding: 8px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .recibo-pix__copiaecola button:hover { background: rgba(255,255,255,0.06); }

  .recibo-sign { margin-top: var(--space-10); text-align: center; }
  .recibo-sign .line { border-top: 1px solid var(--color-text-primary); width: 320px; margin: 0 auto; padding-top: 8px; font-size: var(--fs-sm); }

  .recibo-toolbar__actions { display: flex; gap: var(--space-2); }
  .share-wrap { position: relative; }
  #shareBtn svg { width: 15px; height: 15px; }
  /* .btn define display:inline-flex e, como regra de autor, vence a regra
     [hidden] do navegador mesmo com o atributo presente — sem isso o botão
     apareceria antes dos dados do recibo carregarem. */
  #shareBtn[hidden] { display: none; }
  /* [hidden] some com display:none pelo navegador, mas a regra de layout
     abaixo (display:flex) tem mais especificidade e vencia — o menu ficava
     sempre visível. Precisa do :not([hidden]) para respeitar o atributo. */
  .share-menu[hidden] { display: none; }
  .share-menu:not([hidden]) {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 160px;
    background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg); padding: 6px; display: flex; flex-direction: column; gap: 2px;
  }
  .share-menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: none; background: none;
    border-radius: var(--radius-sm); font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--color-text-primary);
    cursor: pointer; text-align: left;
  }
  .share-menu button:hover { background: var(--color-surface-alt); }
  .share-menu svg { width: 17px; height: 17px; flex-shrink: 0; color: var(--color-text-secondary); }
  .share-menu button#shareWhatsappOpt svg { color: #25D366; }

  /* ---- Impressão: sempre 1 folha A4, conteúdo compactado para caber ---- */
  @page { size: A4; margin: 10mm; }
  @media print {
    html, body { background: #fff; }
    body { padding: 0; }
    .recibo-toolbar { display: none; }
    .recibo-sheet {
      box-shadow: none; border-radius: 0; max-width: 100%; padding: 0;
      page-break-inside: avoid; break-inside: avoid;
    }
    .recibo-head { padding-bottom: 12px; }
    .recibo-head img { height: 40px; }
    .recibo-valor { margin: 14px 0; }
    .recibo-valor .valor { font-size: 26px; }
    .recibo-pix { margin: 14px 0; padding: 14px; gap: 16px; }
    .recibo-pix__keys { margin-top: 10px; gap: 6px; }
    .recibo-pix__key { padding: 6px 10px; }
    .recibo-pix__qr img { width: 110px; height: 110px; padding: 6px; }
    .recibo-pix__qr p { font-size: 9px; margin-top: 5px; }
    .recibo-texto { margin: 14px 0; font-size: 13px; line-height: 1.55; }
    .recibo-grid { margin: 14px 0; }
    .recibo-obs { margin-top: 10px; padding-top: 10px; }
    .recibo-sign { margin-top: 22px; }
    .recibo-pix__key button, .recibo-pix__copiaecola { display: none; }
  }
  @media (max-width: 480px) {
    .recibo-pix { grid-template-columns: 1fr; }
    .recibo-pix__qr { justify-self: center; }
    .recibo-toolbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="recibo-toolbar">
  <a href="locacao-contratos.html" class="btn btn-outline btn-sm">&larr; Voltar</a>
  <div class="recibo-toolbar__actions">
    <div class="share-wrap">
      <button type="button" class="btn btn-outline btn-sm" id="shareBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
        Compartilhar
      </button>
      <div class="share-menu" id="shareMenu" hidden>
        <button type="button" id="shareWhatsappOpt">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2Zm5.8 14.14c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.31-1.64-.6-2.9-1.25-4.8-4.16-4.94-4.35-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.13 1.02-2.42.26-.29.57-.36.76-.36h.55c.18 0 .42-.07.65.5.24.58.81 2 .88 2.14.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.26 1.64 2.04 1.13 1 2.08 1.32 2.37 1.47.29.15.46.13.63-.05.17-.19.72-.84.92-1.13.19-.29.38-.24.63-.14.26.1 1.64.77 1.92.91.29.15.48.22.55.34.07.13.07.72-.17 1.4Z"/></svg>
          WhatsApp
        </button>
        <button type="button" id="shareEmailOpt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          E-mail
        </button>
      </div>
    </div>
    <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">Imprimir / Salvar PDF</button>
  </div>
</div>

<div class="recibo-sheet" id="reciboSheet">
  <p class="empty-state">Carregando recibo...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth-guard.js"></script>
<script>
  function formatMoney(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function formatDateExtenso(d) {
    const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const [y, m, day] = d.split('-').map(Number);
    return `${day} de ${meses[m-1]} de ${y}`;
  }
  function escapeHtml(str) {
    return (str == null ? '' : String(str)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---- Pix — código fixo (mesma chave em todo recibo, sem valor embutido) ----
     O inquilino escaneia o QR (imagem estática local, sem depender de nenhum
     serviço externo) ou copia o código "copia e cola" e confirma o valor no
     app do banco — igual ao aviso de pagamento em papel que já era usado. */
  const PIX_CONFIG = {
    chaves: [
      { label: 'E-mail', valor: 'paulosouzalocacao@gmail.com' },
      { label: 'Telefone', valor: '+5542999549354', exibicao: '(42) 99954-9354' },
    ],
    banco: 'Banco C6',
    // Código Pix "copia e cola" (padrão BR Code/EMV) gerado uma única vez para
    // a chave de e-mail, sem campo de valor — o mesmo texto em todo recibo.
    // O QR correspondente está salvo em assets/pix-qrcode.png.
    copiaECola: '00020126490014br.gov.bcb.pix0127paulosouzalocacao@gmail.com5204000053039865802BR5911PAULO SOUZA6012PONTA GROSSA62070503***63049C36',
  };

  function copyToClipboard(text, btn) {
    const original = btn.textContent;
    function ok() {
      btn.textContent = 'Copiado!';
      btn.classList.add('is-copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('is-copied'); }, 1800);
    }
    function fallback() {
      // navigator.clipboard exige contexto seguro + documento em foco; se falhar
      // (ex.: aba em segundo plano), cai para o método clássico via textarea.
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); ok(); }
      catch (e) { btn.textContent = 'Não foi possível copiar'; setTimeout(() => { btn.textContent = original; }, 2200); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok).catch(fallback);
    } else {
      fallback();
    }
  }
  window.copyPixKey = function (valor, btn) { copyToClipboard(valor, btn); };
  window.copyPixPayload = function (btn) { copyToClipboard(PIX_CONFIG.copiaECola, btn); };

  function renderPixBlock(valor) {
    const keysHtml = PIX_CONFIG.chaves.map(k => `
      <div class="recibo-pix__key">
        <div><span>${escapeHtml(k.label)}</span><strong>${escapeHtml(k.exibicao || k.valor)}</strong></div>
        <button type="button" onclick="copyPixKey('${escapeHtml(k.valor)}', this)">Copiar</button>
      </div>`).join('');
    return `
      <div class="recibo-pix">
        <div>
          <p class="recibo-pix__title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            Pague via Pix
          </p>
          <p class="recibo-pix__bank">${escapeHtml(PIX_CONFIG.banco)} — valor a pagar: ${formatMoney(valor)}</p>
          <div class="recibo-pix__keys">${keysHtml}</div>
          <div class="recibo-pix__copiaecola">
            <button type="button" onclick="copyPixPayload(this)">Copiar código Pix (copia e cola)</button>
          </div>
        </div>
        <div class="recibo-pix__qr">
          <img src="../assets/pix-qrcode.png" alt="QR Code Pix" width="152" height="152">
          <p>Aponte a câmera do banco e confirme o valor acima</p>
        </div>
      </div>`;
  }

  (async function loadRecibo() {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const sheet = document.getElementById('reciboSheet');
    if (!id) { sheet.innerHTML = '<p>Recibo não informado.</p>'; return; }

    const { data: r, error } = await supabaseClient
      .from('recibos')
      .select('*, contratos_locacao(imovel_endereco, proprietarios(nome, cpf_cnpj), inquilinos(nome, cpf_cnpj))')
      .eq('id', id)
      .single();

    if (error || !r) {
      sheet.innerHTML = `<p>Não foi possível carregar o recibo. ${error ? escapeHtml(error.message) : ''}</p>`;
      return;
    }

    const contrato = r.contratos_locacao;
    const proprietario = contrato?.proprietarios;
    const inquilino = contrato?.inquilinos;

    sheet.innerHTML = `
      <div class="recibo-head">
        <img src="../assets/logo-icon.png" alt="PS Corretor">
        <div><p class="eyebrow">Recibo · Aviso de Pagamento</p><h1>Aluguel — ${escapeHtml(r.referencia)}</h1></div>
        <div class="num">Referência<br><strong>${escapeHtml(r.referencia)}</strong></div>
      </div>

      <div class="recibo-valor">
        <p class="label">Valor a pagar / recebido</p>
        <p class="valor">${formatMoney(r.valor)}</p>
      </div>

      ${renderPixBlock(r.valor)}

      <p class="recibo-texto">
        Recebi de <strong>${escapeHtml(inquilino?.nome) || '________________________'}</strong>${inquilino?.cpf_cnpj ? ' (CPF/CNPJ ' + escapeHtml(inquilino.cpf_cnpj) + ')' : ''},
        a quantia de <strong>${formatMoney(r.valor)}</strong>, referente ao aluguel do imóvel situado em
        <strong>${escapeHtml(contrato?.imovel_endereco) || '________________________'}</strong>, relativo ao período de
        <strong>${escapeHtml(r.referencia)}</strong>, dando plena quitação do valor pago em ${formatDateExtenso(r.data_pagamento)}.
      </p>

      <div class="recibo-grid">
        <div><span>Proprietário(a)</span>${escapeHtml(proprietario?.nome) || '—'}${proprietario?.cpf_cnpj ? ' — CPF/CNPJ ' + escapeHtml(proprietario.cpf_cnpj) : ''}</div>
        <div><span>Data do pagamento</span>${formatDateExtenso(r.data_pagamento)}</div>
      </div>

      ${r.observacoes ? `<p class="recibo-obs"><strong>Observações:</strong> ${escapeHtml(r.observacoes)}</p>` : ''}

      <div class="recibo-sign">
        <div class="line">${escapeHtml(proprietario?.nome) || 'Proprietário(a)'}</div>
      </div>
    `;

    setupShare(r, inquilino);
  })();

  /* ---- Compartilhar ----
     Manda um texto pronto (não um link do painel, que exige login) com os
     dados do pagamento e a chave/código Pix.
     Em celular, usa o menu nativo de compartilhamento (Web Share API) — o
     inquilino escolhe WhatsApp, e-mail, SMS, o que tiver instalado. Onde
     essa API não existe (a maioria dos navegadores de computador), mostra
     um menuzinho simples com WhatsApp e E-mail. */
  function buildShareText(r, inquilino) {
    const nome = inquilino?.nome ? `Olá, ${inquilino.nome.split(' ')[0]}! ` : 'Olá! ';
    const chave = PIX_CONFIG.chaves[0];
    return `${nome}Segue o aviso de pagamento do aluguel — *${r.referencia}*.\n\n` +
      `*Valor:* ${formatMoney(r.valor)}\n` +
      `*Vencimento/Pagamento:* ${formatDateExtenso(r.data_pagamento)}\n\n` +
      `*Pague via Pix* (${PIX_CONFIG.banco}):\n` +
      `Chave (${chave.label}): ${chave.exibicao || chave.valor}\n\n` +
      `Código Pix copia e cola:\n${PIX_CONFIG.copiaECola}\n\n` +
      `Qualquer dúvida, é só chamar. Obrigado!`;
  }

  function setupShare(r, inquilino) {
    const btn = document.getElementById('shareBtn');
    const menu = document.getElementById('shareMenu');
    const text = buildShareText(r, inquilino);
    const title = `Aviso de pagamento — Aluguel ${r.referencia}`;
    btn.hidden = false;

    if (navigator.share) {
      // Menu nativo do sistema: sem dropdown próprio, cada clique já abre o
      // seletor de apps (WhatsApp, e-mail, SMS, Drive...).
      btn.addEventListener('click', async () => {
        try { await navigator.share({ title, text }); }
        catch (e) { /* usuário cancelou o menu — não faz nada */ }
      });
      return;
    }

    // Sem Web Share API (desktop): dropdown com as duas opções mais usadas.
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.hidden = !menu.hidden;
    });
    document.getElementById('shareWhatsappOpt').addEventListener('click', () => {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
      menu.hidden = true;
    });
    document.getElementById('shareEmailOpt').addEventListener('click', () => {
      window.location.href = 'mailto:?subject=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(text);
      menu.hidden = true;
    });
    document.addEventListener('click', (e) => {
      if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) menu.hidden = true;
    });
  }
</script>
</body>
</html>
